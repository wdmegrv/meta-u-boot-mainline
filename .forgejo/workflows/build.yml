# CI on Forgejo: runs for main and for the gh-pr-<number> branches that
# .github/workflows/forward-pr.yml pushes. The build-layer job runs
# scripts/build-layer for wrynose and qemuarm64 on the yocto-build runner,
# which needs kas in PATH. The kas work directory is $KAS_WORK_DIR from the
# runner's environment, or ~/kas-work/meta-u-boot-mainline, and is kept
# between runs for its downloads and sstate.
#
# The result goes back to GitHub as the commit status "forgejo/build" on
# the commit that was built, which is the pull request head: GitHub shows
# it on the pull request and branch protection can require it.
#
# Needs the secret GH_STATUS_TOKEN: a GitHub fine-grained token for the
# GitHub repository with "Commit statuses: Read and write".

name: Build

on:
  push:
    branches:
      - main
      - 'gh-pr-*'

env:
  GH_REPO: wdmegrv/meta-u-boot-mainline
  STATUS_CONTEXT: forgejo/build
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
  # Posts the commit status: python3 -c "$REPORT_STATUS" <state> <description>.
  # Python, not curl: the container has python3 for Yocto but no curl.
  REPORT_STATUS: |
    import json, os, sys, urllib.request
    state, description = sys.argv[1:3]
    body = {"state": state, "context": os.environ["STATUS_CONTEXT"],
            "target_url": os.environ["RUN_URL"], "description": description}
    req = urllib.request.Request(
        "https://api.github.com/repos/%s/statuses/%s"
        % (os.environ["GH_REPO"], os.environ["GITHUB_SHA"]),
        data=json.dumps(body).encode(), method="POST",
        headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                 "Accept": "application/vnd.github+json"})
    urllib.request.urlopen(req).close()

jobs:
  build-layer:
    runs-on: yocto-build
    steps:
      - name: Report pending to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
        run: |
          python3 -c "$REPORT_STATUS" pending Building

      - uses: actions/checkout@v4

      - name: build-layer
        run: |
          work_dir=${KAS_WORK_DIR:-$HOME/kas-work/meta-u-boot-mainline}
          scripts/build-layer --release wrynose --machine qemuarm64 --work-dir "$work_dir"

      - name: Report result to GitHub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case $JOB_STATUS in
            success) state=success ;;
            failure) state=failure ;;
            *)       state=error ;;
          esac
          python3 -c "$REPORT_STATUS" "$state" "Build $JOB_STATUS"
