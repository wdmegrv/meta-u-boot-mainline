# Placeholder CI on Forgejo: runs for main and for the gh-pr-<number>
# branches that .github/workflows/forward-pr.yml pushes. The build-layer
# job is a dummy that only prints the scripts/build-layer command.

name: Build

on:
  push:
    branches:
      - main
      - 'gh-pr-*'

jobs:
  build-layer:
    runs-on: docker
    steps:
      - name: build-layer (dummy)
        run: |
          echo "build-layer for $GITHUB_REF_NAME at $GITHUB_SHA"
          echo "would run: scripts/build-layer --release wrynose --machine qemuarm64 --work-dir \"\$KAS_WORK_DIR\""
