# Common base: oe-core, bitbake, meta-poky and this layer, nothing selected.
# Combine with a release-*.yml and a machine-*.yml, and add u-boot-mainline.yml
# to opt in:
#
#   kas build kas/base.yml:kas/release-wrynose.yml:kas/machine-qemuarm64.yml:kas/u-boot-mainline.yml

header:
  version: 14

distro: poky
target:
  - core-image-minimal
  # Not every machine pulls the bootloader into its images (qemuarm64 does not).
  - virtual/bootloader

repos:
  meta-u-boot-mainline:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    layers:
      bitbake: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    layers:
      meta-poky:

bblayers_conf_header:
  base: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  base: |
    CONF_VERSION = "2"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ?= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
  rm_work: |
    INHERIT += "rm_work"
  debug_tweaks: |
    EXTRA_IMAGE_FEATURES ?= "empty-root-password allow-empty-password allow-root-login"
